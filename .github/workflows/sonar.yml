name: Build

on:
  push:
    branches:
      - master
      - stable
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # We do not recommend to use this in a pull request. Prefer using pull request
      # decoration instead.
      # - uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Run CI-driven scan with Burp Action Step
        uses: PortSwigger/ci-driven-scan-github-action@main
        with:
          enterprise-server-url: 'https://e7b82a65.portswigger.cloud'
          enterprise-api-key: 'wNDtztSFdOUMh7WimyElaeSznIYJtpuo'
          start-url: 'https://brokencrystals.com/'
          report-file-path: ${{ github.workspace }}/burp_junit_report.xml
      - name: Upload JUnit report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Upload Burp report
          path: ${{ github.workspace }}/burp_junit_report.xml
      - name: Upload Burp XML
        if: always()
        id: upload-burp-results
        uses: actions/upload-artifact@v4
        with:
          name: burp-results
          path: .burp/burp_xml_report.xml
      - name: Publish web app scan results to pipeline
        if: always()
        id: publish-burp-junit-test-report
        uses: mikepenz/action-junit-report@v3
        with:
          check_name: View Burp scan results
          report_paths: ${{ github.workspace }}/burp_junit_report.xml
          fail_on_failure: false
          require_tests: false